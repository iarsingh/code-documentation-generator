apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-documentation-generator
  labels:
    app: code-documentation-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-documentation-generator
  template:
    metadata:
      labels:
        app: code-documentation-generator
    spec:
      containers:
        - name: api
          image: code-documentation-generator:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: code-documentation-generator
spec:
  selector:
    app: code-documentation-generator
  ports:
    - port: 80
      targetPort: 8080
